schema_version: 1

context:
  name: sqlean.py
  version: "3.54.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlean.py/sqlean_py-${{ version }}.tar.gz
  sha256: 3e5363adbd94c1c8994ff74efda6bbe2094268dc49ea14f04f8e315b3bb9c0e4

build:
  number: 0
  script:
    - python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools >=77
  run:
    - python

tests:
  - python:
      imports:
        - sqlean
      pip_check: true
  - files:
      recipe:
        - run_test.py
    script:
      - python run_test.py

about:
  homepage: https://github.com/nalgeon/sqlean.py
  license: Zlib
  license_file: LICENSE
  summary: sqlite3 with extensions
  repository: https://github.com/nalgeon/sqlean.py

extra:
  recipe-maintainers:
    - anticorrelator
    - axiomofjoy
    - mikeldking
    - RogerHYang
    - xylar
